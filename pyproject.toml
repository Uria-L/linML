[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linML"
version = "0.1.0"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
    "onnxruntime==1.25.0",
    "pylint==4.0.5"
]

[tool.setuptools]
packages = ["src", "isolation_forest"]